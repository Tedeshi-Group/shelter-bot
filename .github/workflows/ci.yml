name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [production]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check syntax
        run: python -m py_compile bot.py && python -m py_compile config.py && python -m py_compile database.py && python -m py_compile cogs/voice_channels.py
